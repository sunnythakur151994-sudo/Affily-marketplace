<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Affily Market – Premium AI Marketplace</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif; }
        body { background: linear-gradient(135deg, #0a0f1a 0%, #050a12 100%); color: #f0f0f0; overflow-x: hidden; min-height: 100vh; }
        
        /* 3D Canvas Background */
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; pointer-events: none; }
        
        /* Glass morphism */
        .glass { background: rgba(20, 25, 40, 0.65); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.15); border-radius: 28px; }
        
        /* Header */
        .main-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background: rgba(10,15,25,0.8); backdrop-filter: blur(10px); border-bottom: 1px solid #FF9900; position: sticky; top: 0; z-index: 100; flex-wrap: wrap; gap: 15px; }
        .logo { font-size: 28px; font-weight: bold; background: linear-gradient(135deg, #FFB347, #FF6600); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .search-area { display: flex; gap: 8px; background: rgba(255,255,255,0.1); border-radius: 60px; padding: 5px 15px; align-items: center; flex-wrap: wrap; }
        .search-area input, .search-area select { background: transparent; border: none; padding: 8px; color: white; outline: none; }
        .search-area button { background: #FF9900; border: none; border-radius: 30px; padding: 8px 20px; cursor: pointer; font-weight: bold; }
        .user-actions button { background: rgba(255,255,255,0.1); border: none; padding: 8px 20px; border-radius: 40px; margin-left: 12px; color: white; cursor: pointer; transition: 0.2s; }
        .user-actions button:hover { background: #FF9900; color: #111; }
        
        /* Product Grid */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; padding: 20px; }
        .product-card { background: rgba(25,30,45,0.8); backdrop-filter: blur(8px); border-radius: 24px; padding: 16px; transition: 0.3s; cursor: pointer; border: 1px solid rgba(255,165,0,0.3); }
        .product-card:hover { transform: translateY(-6px); border-color: #FF9900; box-shadow: 0 15px 30px rgba(0,0,0,0.4); }
        .product-img { width: 100%; height: 200px; object-fit: cover; border-radius: 20px; background: #1e2335; }
        .price { font-size: 24px; font-weight: bold; color: #FFB347; }
        .btn-primary { background: linear-gradient(95deg, #FF9900, #FF6600); border: none; padding: 10px 25px; border-radius: 40px; font-weight: bold; cursor: pointer; color: #111; transition: 0.2s; }
        .btn-primary:hover { transform: scale(1.02); }
        
        /* Product Detail Page */
        .product-detail { max-width: 1200px; margin: 30px auto; padding: 30px; background: rgba(20,25,45,0.75); backdrop-filter: blur(12px); border-radius: 32px; }
        .detail-grid { display: flex; gap: 40px; flex-wrap: wrap; }
        .detail-images { flex: 1; min-width: 250px; }
        .detail-images img { width: 100%; border-radius: 24px; }
        .detail-info { flex: 1; }
        .detail-price { font-size: 36px; color: #FFB347; margin: 15px 0; }
        .payment-methods { display: flex; gap: 15px; flex-wrap: wrap; margin: 20px 0; }
        .payment-option { background: rgba(255,255,255,0.1); padding: 12px 20px; border-radius: 60px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 10px; }
        .payment-option.selected { background: #FF9900; color: #111; }
        .quantity-selector { display: flex; align-items: center; gap: 15px; margin: 20px 0; }
        .quantity-selector button { background: #FF9900; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer; }
        .reviews-section { margin-top: 40px; }
        .review-card { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 15px; margin: 10px 0; }
        .similar-products { margin-top: 40px; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        
        /* Affiliate Dashboard */
        .affiliate-dashboard { display: flex; min-height: 80vh; margin: 20px; background: rgba(0,0,0,0.3); border-radius: 32px; overflow: hidden; }
        .dash-sidebar { width: 280px; background: rgba(15,20,35,0.8); backdrop-filter: blur(12px); padding: 25px 15px; border-right: 1px solid rgba(255,255,255,0.1); }
        .dash-sidebar h3 { margin-bottom: 25px; color: #FF9900; }
        .dash-sidebar ul { list-style: none; }
        .dash-sidebar li { padding: 12px 18px; margin: 8px 0; border-radius: 40px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 12px; }
        .dash-sidebar li:hover, .dash-sidebar .active-tab { background: #FF9900; color: #111; }
        .dash-content { flex: 1; padding: 30px; overflow-y: auto; }
        .stats-cards { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }
        .stat-card { background: rgba(20,25,45,0.7); backdrop-filter: blur(8px); padding: 20px; border-radius: 24px; flex: 1; text-align: center; }
        
        /* Modal */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: rgba(20,25,45,0.95); backdrop-filter: blur(20px); padding: 30px; border-radius: 48px; width: 450px; max-width: 90%; border: 1px solid #FF9900; }
        .modal-content input, .modal-content select { width: 100%; padding: 12px; margin: 10px 0; background: rgba(255,255,255,0.1); border: none; border-radius: 40px; color: white; }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #FF9900; color: #111; padding: 12px 24px; border-radius: 40px; opacity: 0; transition: 0.3s; z-index: 2000; font-weight: bold; }
        @media (max-width: 800px) { .affiliate-dashboard { flex-direction: column; } .dash-sidebar { width: 100%; } }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="main-header">
    <div class="logo">affily<span style="font-size: 18px;">.market</span></div>
    <div class="search-area">
        <select id="globalCategoryFilter"><option value="all">All</option><option>Electronics</option><option>Clothing</option><option>Home</option><option>Beauty</option><option>Sports</option></select>
        <input type="text" id="globalSearch" placeholder="Search...">
        <button onclick="globalSearchProducts()"><i class="fas fa-search"></i> Search</button>
    </div>
    <div class="user-actions">
        <button id="loginBtn"><i class="fas fa-user"></i> Login</button>
        <button id="registerBtn"><i class="fas fa-user-plus"></i> Register</button>
    </div>
</div>

<!-- Buyer Store View -->
<div id="buyerStoreView" style="padding: 20px;">
    <div id="trendingBanner" style="background: linear-gradient(90deg, #FF9900, #FF6600); padding: 12px; border-radius: 60px; text-align: center; width: fit-content; margin: 0 auto 20px auto; display: none;"></div>
    <div class="products-grid" id="productsGrid"></div>
</div>

<!-- Product Detail Page (hidden initially) -->
<div id="productDetailView" style="display: none;"></div>

<!-- Affiliate Dashboard -->
<div id="affiliateDashboardView" style="display: none;">
    <div class="affiliate-dashboard">
        <div class="dash-sidebar">
            <h3><i class="fas fa-store"></i> Affiliate Hub</h3>
            <ul>
                <li data-tab="dash-home" class="active-tab"><i class="fas fa-tachometer-alt"></i> Dashboard</li>
                <li data-tab="dash-products"><i class="fas fa-boxes"></i> Your Products</li>
                <li data-tab="dash-trending"><i class="fas fa-chart-line"></i> Trending</li>
                <li data-tab="dash-generate"><i class="fas fa-robot"></i> Generate with AI</li>
                <li data-tab="dash-add"><i class="fas fa-plus-circle"></i> Add Product</li>
                <li data-tab="dash-orders"><i class="fas fa-shopping-cart"></i> Orders</li>
                <li id="logoutAffiliateBtn"><i class="fas fa-sign-out-alt"></i> Logout</li>
            </ul>
        </div>
        <div class="dash-content" id="affiliateContent"></div>
    </div>
</div>

<!-- Admin Panel -->
<div id="adminPanelView" style="display: none; padding: 30px;">
    <div class="glass" style="padding: 30px;">
        <h2>🤖 AI Bot Control</h2>
        <button id="adminRunBotBtn" class="btn-primary">🚀 Run Bot Now</button>
        <button id="adminToggleAutoBtn" class="btn-primary">🤖 Enable Auto Mode (Daily)</button>
        <button id="adminClearBotBtn" class="btn-primary" style="background:#dc2626;">🗑️ Clear Bot Products</button>
        <div id="adminStats" style="margin-top: 20px;"></div>
        <h3>AI Products</h3>
        <div id="adminBotList"></div>
        <button id="adminLogoutBtn" class="btn-primary">Logout</button>
    </div>
</div>

<!-- Modals -->
<div id="loginModal" class="modal"><div class="modal-content"><h2>Login</h2><input type="text" id="loginId" placeholder="Email"><input type="password" id="loginPass" placeholder="Password"><select id="loginRole"><option value="buyer">Buyer</option><option value="affiliate">Affiliate</option><option value="admin">Admin</option></select><button id="doLoginBtn" class="btn-primary">Login</button><p style="margin-top:10px;">Admin: admin14 / first-ecommerce</p><button id="closeLoginModal" style="background:#333;">Cancel</button></div></div>
<div id="registerModal" class="modal"><div class="modal-content"><h2>Register Affiliate</h2><input type="text" id="regName" placeholder="Full Name"><input type="email" id="regEmail" placeholder="Email"><input type="password" id="regPass" placeholder="Password"><button id="doRegisterBtn" class="btn-primary">Sign Up</button><button id="closeRegModal" style="background:#333;">Cancel</button></div></div>
<div id="toast" class="toast"></div>

<script type="module">
    import * as THREE from 'https://unpkg.com/three@0.128.0/build/three.module.js';
    
    // ==================== 3D BACKGROUND (Enhanced) ====================
    const canvas = document.getElementById('bg-canvas');
    const scene = new THREE.Scene();
    scene.background = null;
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.z = 35;
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    
    // Particle system with color cycling
    let particleSystem;
    const colors = [0xff3366, 0xff6633, 0xff9933, 0xffcc33, 0xff33cc];
    let hue = 0;
    
    function initParticles() {
        const count = 2500;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(count * 3);
        for (let i = 0; i < count; i++) {
            positions[i*3] = (Math.random() - 0.5) * 150;
            positions[i*3+1] = (Math.random() - 0.5) * 80;
            positions[i*3+2] = (Math.random() - 0.5) * 100 - 50;
        }
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const colorArray = new Float32Array(count * 3);
        for (let i = 0; i < count; i++) {
            const col = colors[Math.floor(Math.random() * colors.length)];
            colorArray[i*3] = ((col >> 16) & 255)/255;
            colorArray[i*3+1] = ((col >> 8) & 255)/255;
            colorArray[i*3+2] = (col & 255)/255;
        }
        geometry.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));
        const material = new THREE.PointsMaterial({ size: 0.25, vertexColors: true, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
        particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);
    }
    initParticles();
    
    let time = 0;
    function animate() {
        requestAnimationFrame(animate);
        time += 0.008;
        if (particleSystem) {
            particleSystem.rotation.y = time * 0.15;
            particleSystem.rotation.x = Math.sin(time * 0.3) * 0.15;
            // Pulse colors
            hue = (hue + 0.003) % 1;
            const newColor = new THREE.Color().setHSL(hue, 0.8, 0.6);
            if (particleSystem.material) particleSystem.material.color = newColor;
        }
        camera.position.z = 35 + Math.sin(time * 0.2) * 2;
        camera.lookAt(0, 0, 0);
        renderer.render(scene, camera);
    }
    animate();
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
    
    // ==================== API KEYS (from user) ====================
    const API_KEYS = {
        comet: "sk-VU8ROBbCIVRNVFW9h6m4RyLcl5HAqF6stCegEVpVlxmMMxAg",
        modelslab: "fCP63IJb02QJnbvOjKj2E3EMvis5bHTLPZgttpn8KycSerdbAi3R5t9Fx06c",
        serpapi: "397ff0b93877d12fe77f0ec8e94b9bd17b9efbd013f09518d1a992eab126d572",
        trendsmcp: "tmcp_live_0nknmr5xj3uky6o5sac0p2tmsktpu5z5"
    };
    
    // ==================== DATA STORES ====================
    let products = JSON.parse(localStorage.getItem('affily_products')) || [];
    let orders = JSON.parse(localStorage.getItem('affily_orders')) || [];
    let users = JSON.parse(localStorage.getItem('affily_users')) || [];
    let currentUser = null;
    let botStats = JSON.parse(localStorage.getItem('bot_stats')) || { totalDiscovered:0, totalPublished:0, platformRevenue:0 };
    let autoModeEnabled = localStorage.getItem('auto_mode') === 'true';
    let autoInterval = null;
    
    function saveData() {
        localStorage.setItem('affily_products', JSON.stringify(products));
        localStorage.setItem('affily_orders', JSON.stringify(orders));
        localStorage.setItem('affily_users', JSON.stringify(users));
        localStorage.setItem('bot_stats', JSON.stringify(botStats));
    }
    function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.style.opacity = '1'; setTimeout(() => t.style.opacity = '0', 3000); }
    function escapeHtml(str) { return String(str||'').replace(/[&<>]/g, m=>m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }
    
    // ==================== IMAGE GENERATION (GUARANTEED) ====================
    async function generateProductImage(productName) {
        // Try CometAPI
        if (API_KEYS.comet) {
            try {
                const res = await fetch('https://api.cometapi.com/v1/midjourney/imagine', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${API_KEYS.comet}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: productName, width: 512, height: 512 })
                });
                const data = await res.json();
                if (data.images?.[0]?.url) return data.images[0].url;
            } catch(e) { console.warn("CometAPI error", e); }
        }
        // Fallback: always return a styled placeholder with product name
        return `https://placehold.co/400x400?text=${encodeURIComponent(productName.substring(0,25))}&font=roboto&bg=FF9900&text=FFFFFF`;
    }
    
    // ==================== TRENDING DISCOVERY ====================
    async function fetchTrendingProducts() {
        if (API_KEYS.serpapi) {
            try {
                const res = await fetch(`https://serpapi.com/search.json?engine=google_shopping&q=trending+products&api_key=${API_KEYS.serpapi}`);
                const data = await res.json();
                if (data.shopping_results) return data.shopping_results.slice(0,8).map(item => ({ title: item.title, category: "Electronics", basePrice: parseFloat(item.price?.replace(/[^0-9.]/g,''))||15, platform: "SerpApi" }));
            } catch(e) {}
        }
        return [{ title: "Wireless Earbuds Pro", category: "Electronics", basePrice: 19.99, platform: "mock" }];
    }
    
    async function runBotDiscovery() {
        showToast("🤖 Scanning trending products...");
        const trending = await fetchTrendingProducts();
        let published = 0;
        for (let item of trending.slice(0,6)) {
            if (products.some(p => p.title.toLowerCase() === item.title.toLowerCase())) continue;
            const img = await generateProductImage(item.title);
            const margin = 0.1 + Math.random() * 0.15;
            const sellingPrice = Math.round(item.basePrice * (1 + margin) * 100) / 100;
            const newProduct = {
                id: 'ai_'+Date.now()+'_'+Math.random().toString(36).substr(2,6),
                affiliateId: 'ai_bot',
                title: item.title,
                description: `🔥 Trending product: ${item.title}. High quality, fast shipping.`,
                category: item.category,
                condition: 'new',
                basePrice: Math.round(item.basePrice * 100),
                sellingPrice: Math.round(sellingPrice * 100),
                imageUrl: img,
                rating: 4.5,
                status: 'active',
                botAdded: true
            };
            products.unshift(newProduct);
            published++;
            botStats.totalDiscovered++; botStats.totalPublished++;
        }
        saveData();
        showToast(`✅ Published ${published} new AI products!`);
        if (currentUser?.role === 'admin') renderAdminPanel();
        renderBuyerStore();
    }
    
    // Auto mode
    function startAutoMode() {
        if (autoInterval) clearInterval(autoInterval);
        autoInterval = setInterval(runBotDiscovery, 24 * 60 * 60 * 1000); // daily
        autoModeEnabled = true;
        localStorage.setItem('auto_mode', 'true');
        showToast("Auto mode enabled – will run daily");
    }
    function stopAutoMode() {
        if (autoInterval) clearInterval(autoInterval);
        autoModeEnabled = false;
        localStorage.setItem('auto_mode', 'false');
        showToast("Auto mode disabled");
    }
    function toggleAutoMode() { autoModeEnabled ? stopAutoMode() : startAutoMode(); }
    
    // ==================== PRODUCT DETAIL PAGE ====================
    function showProductDetail(productId) {
        const product = products.find(p => p.id === productId);
        if (!product) return;
        const similar = products.filter(p => p.category === product.category && p.id !== productId).slice(0,4);
        // Mock reviews
        const reviews = [
            { user: "John D.", rating: 5, comment: "Amazing product, fast delivery!" },
            { user: "Sarah K.", rating: 4, comment: "Good quality, worth the price." },
            { user: "Mike L.", rating: 5, comment: "Exceeded my expectations." }
        ];
        let quantity = 1;
        let selectedPayment = "Credit Card";
        
        const detailHtml = `
            <div class="product-detail">
                <button id="backToShopBtn" class="btn-primary" style="margin-bottom:20px;"><i class="fas fa-arrow-left"></i> Back to Shop</button>
                <div class="detail-grid">
                    <div class="detail-images">
                        <img src="${product.imageUrl}" alt="${escapeHtml(product.title)}" onerror="this.src='https://placehold.co/400x400?text=No+Image'">
                    </div>
                    <div class="detail-info">
                        <h1>${escapeHtml(product.title)}</h1>
                        <p>${escapeHtml(product.description || "No description available.")}</p>
                        <div class="detail-price">$${(product.sellingPrice/100).toFixed(2)}</div>
                        <div class="quantity-selector">
                            <span>Quantity:</span>
                            <button id="qtyMinus">-</button>
                            <span id="qtyValue">1</span>
                            <button id="qtyPlus">+</button>
                        </div>
                        <div class="payment-methods">
                            <div data-method="Credit Card" class="payment-option selected"><i class="fab fa-cc-visa"></i> Credit Card</div>
                            <div data-method="PayPal" class="payment-option"><i class="fab fa-paypal"></i> PayPal</div>
                            <div data-method="Crypto" class="payment-option"><i class="fab fa-bitcoin"></i> Crypto</div>
                            <div data-method="Cash on Delivery" class="payment-option"><i class="fas fa-truck"></i> Cash on Delivery</div>
                            <div data-method="Bank Transfer" class="payment-option"><i class="fas fa-university"></i> Bank Transfer</div>
                        </div>
                        <button id="buyNowDetailBtn" class="btn-primary" style="width:100%; margin-top:20px;">Buy Now</button>
                    </div>
                </div>
                <div class="reviews-section">
                    <h3>Customer Reviews</h3>
                    ${reviews.map(r => `<div class="review-card"><strong>${r.user}</strong> ${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}<p>${r.comment}</p></div>`).join('')}
                </div>
                <div class="similar-products">
                    <h3>Similar Products</h3>
                    <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:15px;">
                        ${similar.map(p => `
                            <div class="product-card" style="cursor:pointer;" onclick="showProductDetail('${p.id}')">
                                <img src="${p.imageUrl}" style="width:100%; height:120px; object-fit:cover; border-radius:16px;">
                                <h4>${escapeHtml(p.title)}</h4>
                                <div>$${(p.sellingPrice/100).toFixed(2)}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>
        `;
        document.getElementById('buyerStoreView').style.display = 'none';
        document.getElementById('productDetailView').style.display = 'block';
        document.getElementById('productDetailView').innerHTML = detailHtml;
        
        // Event handlers for detail page
        document.getElementById('backToShopBtn').onclick = () => {
            document.getElementById('productDetailView').style.display = 'none';
            document.getElementById('buyerStoreView').style.display = 'block';
            renderBuyerStore();
        };
        document.querySelectorAll('.payment-option').forEach(opt => {
            opt.onclick = () => {
                document.querySelectorAll('.payment-option').forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');
                selectedPayment = opt.dataset.method;
            };
        });
        document.getElementById('qtyMinus').onclick = () => { if (quantity > 1) { quantity--; document.getElementById('qtyValue').innerText = quantity; } };
        document.getElementById('qtyPlus').onclick = () => { quantity++; document.getElementById('qtyValue').innerText = quantity; };
        document.getElementById('buyNowDetailBtn').onclick = () => {
            const total = (product.sellingPrice/100) * quantity;
            showToast(`Order placed! Payment: ${selectedPayment}, Total: $${total.toFixed(2)}. Thank you!`);
            // Save order
            const newOrder = { id:'ord_'+Date.now(), productId: product.id, affiliateId: product.affiliateId, soldPrice: product.sellingPrice, quantity, payment: selectedPayment, status: 'completed', customerEmail: currentUser?.email || 'guest', date: new Date() };
            orders.push(newOrder);
            botStats.platformRevenue += 0; // optional fee
            saveData();
            document.getElementById('productDetailView').style.display = 'none';
            document.getElementById('buyerStoreView').style.display = 'block';
            renderBuyerStore();
        };
    }
    window.showProductDetail = showProductDetail;
    
    // ==================== BUYER STORE ====================
    function renderBuyerStore() {
        const container = document.getElementById('productsGrid');
        let filtered = products.filter(p => p.status === 'active');
        const cat = document.getElementById('globalCategoryFilter').value;
        if (cat !== 'all') filtered = filtered.filter(p => p.category === cat);
        const search = document.getElementById('globalSearch').value.toLowerCase();
        if (search) filtered = filtered.filter(p => p.title.toLowerCase().includes(search));
        container.innerHTML = filtered.map(p => `
            <div class="product-card" onclick="showProductDetail('${p.id}')">
                <img src="${p.imageUrl}" class="product-img" onerror="this.src='https://placehold.co/400x400?text=No+Image'">
                <h4>${escapeHtml(p.title)}</h4>
                <div class="price">$${(p.sellingPrice/100).toFixed(2)}</div>
                <button class="btn-primary" style="margin-top:10px;">View Details</button>
            </div>
        `).join('');
        const banner = document.getElementById('trendingBanner');
        if (products.some(p=>p.botAdded)) { banner.innerHTML = '🔥 AI-trending products available!'; banner.style.display = 'block'; }
        else banner.style.display = 'none';
    }
    window.globalSearchProducts = () => renderBuyerStore();
    document.getElementById('globalCategoryFilter').addEventListener('change', () => renderBuyerStore());
    
    // ==================== AFFILIATE DASHBOARD ====================
    function showAffiliateTab(tabId) {
        const contentDiv = document.getElementById('affiliateContent');
        if (tabId === 'dash-home') {
            const myProducts = products.filter(p => p.affiliateId === currentUser.id);
            const myOrders = orders.filter(o => o.affiliateId === currentUser.id);
            const earnings = myOrders.reduce((s,o)=>s+o.soldPrice,0);
            contentDiv.innerHTML = `<div class="stats-cards"><div class="stat-card"><h3>💰 Earnings</h3><h2>$${(earnings/100).toFixed(2)}</h2></div><div class="stat-card"><h3>📦 Sales</h3><h2>${myOrders.length}</h2></div><div class="stat-card"><h3>🛍️ Products</h3><h2>${myProducts.length}</h2></div></div><p>Welcome, ${currentUser.name}!</p>`;
        }
        else if (tabId === 'dash-products') {
            const myProducts = products.filter(p => p.affiliateId === currentUser.id);
            contentDiv.innerHTML = `<h2>Your Products</h2><div class="products-grid">${myProducts.map(p => `<div class="product-card"><img src="${p.imageUrl}" class="product-img"><h4>${escapeHtml(p.title)}</h4><div>$${(p.sellingPrice/100).toFixed(2)}</div><button onclick="deleteProduct('${p.id}')" class="btn-primary" style="background:#dc2626;">Delete</button></div>`).join('')}</div>`;
        }
        else if (tabId === 'dash-trending') {
            const trending = products.filter(p => p.botAdded);
            contentDiv.innerHTML = `<h2>🔥 Trending Products</h2><div class="products-grid">${trending.map(p => `<div class="product-card"><img src="${p.imageUrl}" class="product-img"><h4>${escapeHtml(p.title)}</h4><div>$${(p.sellingPrice/100).toFixed(2)}</div></div>`).join('')}</div>`;
        }
        else if (tabId === 'dash-generate') {
            contentDiv.innerHTML = `<h2>Generate with AI</h2><input type="text" id="aiProductIdea" placeholder="Product idea (e.g., 'Smart water bottle')" style="width:100%;padding:12px;"><button id="generateAiBtn" class="btn-primary">Generate</button><div id="aiResult"></div>`;
            document.getElementById('generateAiBtn').onclick = async () => {
                const idea = document.getElementById('aiProductIdea').value;
                if (!idea) return;
                showToast("AI generating...");
                const img = await generateProductImage(idea);
                const newProd = { id: 'aff_'+Date.now(), affiliateId: currentUser.id, title: idea, description: "AI generated product", category: "General", basePrice: 1000, sellingPrice: 2500, imageUrl: img, status: 'active' };
                products.push(newProd);
                saveData();
                showToast("Product added!");
                showAffiliateTab('dash-products');
            };
        }
        else if (tabId === 'dash-add') {
            contentDiv.innerHTML = `<h2>Add Product</h2><div class="product-form"><input type="text" id="prodTitle" placeholder="Title"><textarea id="prodDesc" placeholder="Description"></textarea><input type="text" id="prodCategory" placeholder="Category"><input type="number" id="prodPrice" placeholder="Selling Price (USD)"><input type="text" id="prodImage" placeholder="Image URL (optional)"><button id="addProductBtn" class="btn-primary">Add</button></div>`;
            document.getElementById('addProductBtn').onclick = async () => {
                const title = document.getElementById('prodTitle').value;
                if (!title) return;
                let img = document.getElementById('prodImage').value;
                if (!img) img = await generateProductImage(title);
                const newProd = { id: 'aff_'+Date.now(), affiliateId: currentUser.id, title, description: document.getElementById('prodDesc').value, category: document.getElementById('prodCategory').value, basePrice: 0, sellingPrice: Math.round(parseFloat(document.getElementById('prodPrice').value)*100), imageUrl: img, status: 'active' };
                products.push(newProd);
                saveData();
                showToast("Product added");
                showAffiliateTab('dash-products');
            };
        }
        else if (tabId === 'dash-orders') {
            const myOrders = orders.filter(o => o.affiliateId === currentUser.id);
            contentDiv.innerHTML = `<h2>Orders</h2>${myOrders.map(o => `<div>Order ${o.id} - $${(o.soldPrice/100).toFixed(2)} - ${o.payment || 'Card'}</div>`).join('')}`;
        }
    }
    
    function renderAffiliateDashboard() {
        if (!currentUser || currentUser.role !== 'affiliate') return;
        document.getElementById('buyerStoreView').style.display = 'none';
        document.getElementById('productDetailView').style.display = 'none';
        document.getElementById('affiliateDashboardView').style.display = 'block';
        document.getElementById('adminPanelView').style.display = 'none';
        showAffiliateTab('dash-home');
        document.querySelectorAll('.dash-sidebar li[data-tab]').forEach(li => li.onclick = () => showAffiliateTab(li.dataset.tab));
        document.getElementById('logoutAffiliateBtn').onclick = () => { currentUser = null; showBuyerView(); };
    }
    
    window.deleteProduct = (id) => { products = products.filter(p=>p.id!==id); saveData(); renderAffiliateDashboard(); renderBuyerStore(); };
    
    // ==================== ADMIN PANEL ====================
    function renderAdminPanel() {
        document.getElementById('buyerStoreView').style.display = 'none';
        document.getElementById('productDetailView').style.display = 'none';
        document.getElementById('affiliateDashboardView').style.display = 'none';
        document.getElementById('adminPanelView').style.display = 'block';
        document.getElementById('adminStats').innerHTML = `Discovered: ${botStats.totalDiscovered} | Published: ${botStats.totalPublished} | Revenue: $${(botStats.platformRevenue/100).toFixed(2)}`;
        const botProds = products.filter(p=>p.botAdded);
        document.getElementById('adminBotList').innerHTML = botProds.map(p => `<div><img src="${p.imageUrl}" width="50"> ${p.title} - $${(p.sellingPrice/100).toFixed(2)}</div>`).join('');
        document.getElementById('adminRunBotBtn').onclick = runBotDiscovery;
        document.getElementById('adminToggleAutoBtn').onclick = toggleAutoMode;
        document.getElementById('adminClearBotBtn').onclick = () => { products = products.filter(p=>!p.botAdded); saveData(); renderBuyerStore(); renderAdminPanel(); };
        document.getElementById('adminLogoutBtn').onclick = () => { currentUser = null; showBuyerView(); };
    }
    
    function showBuyerView() {
        document.getElementById('buyerStoreView').style.display = 'block';
        document.getElementById('productDetailView').style.display = 'none';
        document.getElementById('affiliateDashboardView').style.display = 'none';
        document.getElementById('adminPanelView').style.display = 'none';
        renderBuyerStore();
    }
    
    // ==================== AUTH ====================
    function openLoginModal() { document.getElementById('loginModal').style.display = 'flex'; }
    function closeLoginModal() { document.getElementById('loginModal').style.display = 'none'; }
    function openRegisterModal() { document.getElementById('registerModal').style.display = 'flex'; }
    function closeRegisterModal() { document.getElementById('registerModal').style.display = 'none'; }
    document.getElementById('loginBtn').onclick = openLoginModal;
    document.getElementById('registerBtn').onclick = openRegisterModal;
    document.getElementById('closeLoginModal').onclick = closeLoginModal;
    document.getElementById('closeRegModal').onclick = closeRegisterModal;
    
    document.getElementById('doLoginBtn').onclick = () => {
        const id = document.getElementById('loginId').value;
        const pass = document.getElementById('loginPass').value;
        const role = document.getElementById('loginRole').value;
        if (role === 'admin') {
            if (id === 'admin14' && pass === 'first-ecommerce') {
                currentUser = { id: 'admin', role: 'admin', name: 'Admin' };
                closeLoginModal();
                renderAdminPanel();
                showToast('Admin logged in');
            } else showToast('Invalid admin');
            return;
        }
        const user = users.find(u => u.email === id && u.password === pass && u.role === role);
        if (user) {
            currentUser = user;
            closeLoginModal();
            if (role === 'affiliate') renderAffiliateDashboard();
            else showBuyerView();
            showToast(`Welcome ${user.name}`);
        } else showToast('Invalid credentials');
    };
    document.getElementById('doRegisterBtn').onclick = () => {
        const name = document.getElementById('regName').value;
        const email = document.getElementById('regEmail').value;
        const pass = document.getElementById('regPass').value;
        if (!name || !email || !pass) { showToast('All fields required'); return; }
        if (users.find(u => u.email === email)) { showToast('Email exists'); return; }
        users.push({ id: 'user_'+Date.now(), name, email, password: pass, role: 'affiliate' });
        saveData();
        showToast('Registered! Please login.');
        closeRegisterModal();
        openLoginModal();
    };
    
    // Initialize demo data
    if (products.length === 0) {
        products.push({ id:'demo1', affiliateId:'ai_bot', title:'Wireless Headphones', category:'Electronics', basePrice:2000, sellingPrice:4999, imageUrl:'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=300', description:'High quality sound', rating:4.5, status:'active', botAdded:true });
        products.push({ id:'demo2', affiliateId:'ai_bot', title:'Smart Watch', category:'Electronics', basePrice:3500, sellingPrice:7999, imageUrl:'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300', description:'Track your fitness', rating:4.7, status:'active', botAdded:true });
        saveData();
    }
    if (autoModeEnabled) startAutoMode();
    showBuyerView();
</script>
</body>
</html>
